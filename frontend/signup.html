<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Real Estate Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <img src="logo8.png" alt="Logo" class="logo-img">
      <span class="logo-text">Real Estate<span class="highlight">Hub</span></span>
    </div>
    <nav>
      <ul id="nav-links"></ul>
    </nav>
  </header>

  <!-- Auth Section -->
  <section class="auth-section">
    <!-- Left Image Slideshow -->
    <div class="auth-image">
      <div class="auth-slideshow">
        <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=1600&q=80');" data-title="Find Your Dream Home ✨" data-subtitle="Explore, Buy, Rent — All in one place"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1600&q=80');" data-title="Luxury Homes Await 🏡" data-subtitle="Join thousands of happy buyers & sellers"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80');" data-title="Seamless Experience 🔑" data-subtitle="No brokers, just direct connections"></div>
      </div>
      <div class="auth-overlay">
        <h2 id="overlayTitle">Find Your Dream Home ✨</h2>
        <p id="overlaySubtitle">Explore, Buy, Rent — All in one place</p>
      </div>
    </div>

    <!-- Right Form -->
    <div class="auth-card">
      <h2>Create Account </h2>
      <p class="subtitle">Join us and find your dream property today</p>
      
      <form id="signupForm">
        <div class="input-group">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" placeholder="Enter your first name" required>
        </div>

        <div class="input-group">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" placeholder="Enter your last name" required>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="password" required>
            <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="confirm password" required>
            <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</span>
          </div>
        </div>

        <div class="input-group">
          <label for="user_type">Account Type</label>
          <select id="user_type" required>
            <option value="">Select Role</option>
            <option value="buyer">Buyer</option>
            <option value="seller">Seller</option>
          </select>
        </div>

        <p id="error" class="error-msg"></p>
        <button type="submit" class="btn-auth">Sign Up</button>
      </form>

      <p class="switch-link">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </section>

  <footer>
    <p>Design and Developed by Maisara Ali Shehu</p>
  </footer>

  <script src="auth.js"></script>
  <script src="nav.js"></script>
</body>
</html>
