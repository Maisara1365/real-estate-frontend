<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaging</title>
  <link rel="stylesheet" href="style.css"> <!-- General styles -->
  <link rel="stylesheet" href="message.css"> <!-- Messaging styles -->
</head>
<body>
   <!-- Header -->
  <header>
    <div class="logo">
      <img src="logo8.png" alt="Logo" class="logo-img">
      <span class="logo-text">Real Estate<span class="highlight">Hub</span></span>
    </div>
    <nav>
      <ul id="nav-links"></ul>
    </nav>
  </header>

  <main class="messaging-container">
    <!-- Thread list -->
    <aside class="thread-list" id="threadList">
      <h2>Conversations</h2>
      <input type="text" id="searchInput" placeholder="Search..." class="search-bar">
      <div id="threads"></div>
    </aside>

    <!-- Conversation panel -->
    <section class="conversation-panel">
      <div id="conversationHeader" class="conversation-header">
        <h2>Select a conversation</h2>
        <span class="status offline">Offline</span>
      </div>

      <div id="conversationMessages" class="conversation-messages"></div>
      <div id="typingIndicator" class="typing-indicator" style="display:none;">
        <em>Typing...</em>
      </div>

      <!-- Send message form -->
      <form id="sendMessageForm" class="message-form">
        <input type="text" id="messageInput" placeholder="Type a message..." required>
        <button type="submit">➤</button>
      </form>
    </section>
  </main>
  
  <footer>
    <p>&copy; 2025 Real Estate Hub | All Rights Reserved</p>
  </footer>

  <script src="nav.js"></script> <!-- General script -->
  <script src="message.js"></script> <!-- Messaging script -->
</body>
</html>
