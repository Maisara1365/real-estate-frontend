<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Property Details - Real Estate Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="property.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Header -->
	<header>
	  <div class="logo">
		<img src="logo8.png" alt="Logo" class="logo-img">
		<span class="logo-text">Real Estate<span class="highlight">Hub</span></span>
	  </div>
	  <nav>
		<ul id="nav-links">
		
		</ul>
	  </nav>
	</header>
	
  <main class="page-container">
    <section class="property-detail">
      <div class="property-media">
        <img id="propertyImage" src="default.jpg" alt="Property image" />
      </div>

      <div class="property-info">
        <h1 id="propTitle">Loading…</h1>
        <p class="price" id="propPrice"></p>

        <div class="property-meta">
          <p><i class="fa-solid fa-location-dot"></i> <span id="propLocation"></span></p>
          <p><i class="fa-solid fa-circle-check"></i> <span id="propStatus"></span></p>
        </div>

        <h3><i class="fa-solid fa-file-lines"></i> Description</h3>
        <p id="propDescription"></p>

        <h3><i class="fa-solid fa-user"></i> Seller</h3>
        <p id="sellerInfo"></p>

        <!-- ✅ Message Seller Button -->
        <div id="messageSellerContainer"></div>

        <div class="actions" id="actionButtons">
          <!-- Edit/Delete will be injected -->
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Real Estate Hub | All Rights Reserved</p>
  </footer>

  <script src="property.js"></script>
  <script src="nav.js"></script>
</body>
</html>
