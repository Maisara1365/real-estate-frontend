<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Edit Property - Real Estate Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="property.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">
      <img src="logo8.png" alt="Logo" class="logo-img">
      <span class="logo-text">Real Estate<span class="highlight">Hub</span></span>
    </div>
    <nav>
      <ul id="nav-links"></ul>
    </nav>
  </header>

  <main class="page-container">
    <section class="form-card">
      <h2>Edit Property</h2>
      <p class="form-subtitle">Update your property details below</p>

      <form id="editPropertyForm" enctype="multipart/form-data" class="styled-form">
        <div class="form-row">
          <label for="title">Title</label>
          <input id="title" name="title" required />
        </div>

        <div class="form-row">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" required></textarea>
        </div>

        <div class="form-row">
          <label for="price">Price (₦)</label>
          <input id="price" name="price" type="number" min="0" required />
        </div>

        <div class="form-row">
          <label for="location">Location</label>
          <input id="location" name="location" required />
        </div>

        <div class="form-row">
          <label>Current Image</label>
          <img id="currentThumb" src="" alt="Current thumbnail" class="thumb-preview" />
        </div>

        <div class="form-row">
          <label for="thumbnail">Replace Image</label>
          <input id="thumbnail" name="thumbnail" type="file" accept="image/*" />
        </div>

        <p id="editError" class="error-msg"></p>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Save Changes</button>
          <button id="deleteBtn" type="button" class="btn-danger">Delete Property</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>Design and Developed by Maisara Ali Shehu</p>
  </footer>

  <script src="property.js"></script>
  <script src="nav.js"></script>
</body>
</html>
